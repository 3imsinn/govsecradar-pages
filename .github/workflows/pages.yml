name: GovSecRadar Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: web/api/feed.json
          key: feed-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: feed-
      - run: python3 tools/feed.py
        env:
          ANDROID_TEST_URL: ${{ vars.ANDROID_TEST_URL }}
      - uses: actions/cache/save@v4
        with:
          path: web/api/feed.json
          key: feed-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.page_url }}
    steps:
      - id: site
        uses: actions/deploy-pages@v4
